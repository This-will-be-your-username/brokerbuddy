{{define "style"}}
<script>
// Apply the saved theme before first paint so there is no flash. "auto" = follow the system.
(function () { try { var t = localStorage.getItem('bb-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9;--card:#ffffff;--soft:#f1f3f6;--fg:#111827;--mut:#6b7280;--line:#e5e7eb;
  --acc:#4f46e5;--acc-fg:#ffffff;--pos:#059669;--neg:#dc2626;--warn:#b45309;
  --shadow:0 1px 2px rgba(16,24,40,.05);--radius:14px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0b0f17;--card:#121826;--soft:#1a2234;--fg:#e5e7eb;--mut:#9ca3af;--line:#232c3d;
  --acc:#8b93ff;--acc-fg:#0b0f17;--pos:#34d399;--neg:#f87171;--warn:#fbbf24;--shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]):not([data-theme=dark]){
    color-scheme:dark;
    --bg:#0b0f17;--card:#121826;--soft:#1a2234;--fg:#e5e7eb;--mut:#9ca3af;--line:#232c3d;
    --acc:#8b93ff;--acc-fg:#0b0f17;--pos:#34d399;--neg:#f87171;--warn:#fbbf24;--shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:0 16px 64px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px;font-weight:600;color:var(--fg)}
p{margin:0 0 10px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere;word-break:break-all}
.mut{color:var(--mut)}.small{font-size:13px}.flash{color:var(--acc)}
.neg{color:var(--neg)}.pos{color:var(--pos)}.warn{color:var(--warn)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card>:last-child{margin-bottom:0}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid>*{min-width:0}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.scroll{overflow-x:auto}

/* controls */
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;max-width:100%}
input,select,textarea{padding:8px 11px}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
button{cursor:pointer;font-weight:500;transition:background .12s,border-color .12s}
button:hover{background:var(--soft)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
button.primary:hover{filter:brightness(1.08);background:var(--acc)}
button.danger{color:var(--neg)}
button:disabled{opacity:.5;cursor:not-allowed}
input::placeholder{color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);padding:0}
input[type=range]{accent-color:var(--acc);padding:0;border:0;background:none}
form.inline{display:inline;margin:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;background:none;padding:6px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on,.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-fg)}
.seg a{display:inline-flex}.seg a button{border-radius:0}

/* tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12.5px;white-space:nowrap}
tbody tr:hover td,table tr:hover td{background:var(--soft)}
th.n,td.n,td.amt{text-align:right;font-variant-numeric:tabular-nums}
.out{color:var(--fg)}.in{color:var(--pos)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--mut);font-size:12px}
.bar{height:6px;background:var(--acc);border-radius:3px;opacity:.75}

/* long text collapses to one line; click (or Enter) on a truncated one to expand it */
td.grow{width:100%;max-width:0;min-width:150px}
.clamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp.over{cursor:pointer}
.clamp.over:hover{color:var(--fg)}
.clamp.open{white-space:normal;overflow:visible;overflow-wrap:anywhere}

/* top navigation */
nav.top{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:14px 0;margin-bottom:12px}
nav.top a{padding:6px 12px;border-radius:10px;color:var(--mut);font-weight:500}
nav.top a:hover{background:var(--soft);color:var(--fg);text-decoration:none}
nav.top a[aria-current=page]{background:var(--soft);color:var(--fg)}
nav.top .brand{font-weight:700;color:var(--fg);margin-right:10px;padding-left:0;letter-spacing:-.01em}
nav.top .brand:hover{background:none}
nav.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
nav.top .seg button{padding:4px 10px;font-size:13px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:24px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:13px}
.chartbox{position:relative;height:300px}
@media(max-width:560px){main{padding:0 12px 48px}.card{padding:14px}.chartbox{height:250px}}
</style>
{{end}}
{{define "navstyle"}}{{end}}
