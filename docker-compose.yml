---
services:
  brokerbuddy:
    image: ghcr.io/this-will-be-your-username/brokerbuddy:latest
    container_name: brokerbuddy
    pull_policy: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/brokerbuddy/data:/data
    ports:
      - 127.0.0.1:8443:8443
    restart: unless-stopped
