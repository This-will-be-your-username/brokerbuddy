# docker compose up -d   then open https://localhost:8443
# Every ${VAR:-default} below can be overridden in the shell or in a .env file next to this one.
services:
  brokerbuddy:
    image: ${BROKERBUDDY_IMAGE:-ghcr.io/this-will-be-your-username/brokerbuddy:latest}
    # build: .   # use instead of "image" to build from this checkout
    container_name: brokerbuddy
    restart: unless-stopped
    ports:
      # Loopback only by default. Set BROKERBUDDY_BIND=0.0.0.0 only after setting a password in Settings.
      - "${BROKERBUDDY_BIND:-127.0.0.1}:${BROKERBUDDY_PORT:-8443}:8443"
    volumes:
      - ${BROKERBUDDY_DATA:-brokerbuddy-data}:/data   # a volume name, or a folder path for a bind mount
    environment:
      TZ: ${TZ:-UTC}

volumes:
  brokerbuddy-data:
