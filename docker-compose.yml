# docker compose up -d   then open https://localhost:8443
services:
  brokerbuddy:
    image: ghcr.io/this-will-be-your-username/brokerbuddy:latest
    # or build it yourself instead:  build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"   # loopback only; set a password in Settings before exposing it further
    volumes:
      - brokerbuddy-data:/data
volumes:
  brokerbuddy-data:
